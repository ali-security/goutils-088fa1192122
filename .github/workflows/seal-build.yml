name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Pack module zip
        run: |
          set -euo pipefail
          # Module tree copy without the seal-added .github workflow (upstream ships no .github).
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/packer" build_output
          rsync -a --exclude '.git' --exclude '.github' src/ "$RUNNER_TEMP/modsrc/"
          cat > "$RUNNER_TEMP/packer/main.go" <<'EOF'
          package main

          import (
            "log"
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
          )

          func main() {
            m := module.Version{Path: os.Args[1], Version: os.Args[2]}
            f, err := os.Create(os.Args[4])
            if err != nil {
              log.Fatal(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
              log.Fatal(err)
            }
          }
          EOF
          cd "$RUNNER_TEMP/packer"
          go mod init example.com/packer
          go get golang.org/x/mod@v0.14.0
          go run . github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/build_output/v1.1.0.zip"
          unzip -l "$GITHUB_WORKSPACE/build_output/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: build_output/v1.1.0.zip
          if-no-files-found: error
